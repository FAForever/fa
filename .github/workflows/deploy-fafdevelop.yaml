name: Deploy to FAF Develop

# Prevent simultaneous deployments across all deployment branches as
# the server is unable to process multiple deployments at the same time.

concurrency:
  cancel-in-progress: true
  group: deployment

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 4"

jobs:
  # Resolves the staging branch once, so that a stage run during this workflow
  # does not change what is tested, deployed and reported
  refs:
    name: Resolve staging/fafdevelop
    runs-on: ubuntu-latest
    outputs:
      staging: ${{ steps.refs.outputs.staging }}
      previous: ${{ steps.refs.outputs.previous }}
    steps:
      - name: Resolve references
        id: refs
        run: |
          remote="https://github.com/${{ github.repository }}"
          staging=$(git ls-remote "$remote" refs/heads/staging/fafdevelop | cut -f1)
          previous=$(git ls-remote "$remote" refs/heads/deploy/fafdevelop | cut -f1)
          test -n "$staging"
          echo "staging=$staging" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

  # Test what is deployed, the staging branch includes labeled pull requests
  test:
    needs: [refs]
    uses: ./.github/workflows/tests.yaml
    with:
      ref: ${{ needs.refs.outputs.staging }}

  changelog:
    name: Create changelog of FAF Develop
    needs: [refs]
    uses: ./.github/workflows/docs-generate-changelog.yaml
    with:
      branch: staging/fafdevelop
      ref: ${{ needs.refs.outputs.staging }}

  changelog-lua:
    name: Convert changelog to Lua
    needs: [refs, changelog]
    uses: ./.github/workflows/docs-convert-changelog.yaml
    with:
      branch: staging/fafdevelop
      ref: ${{ needs.refs.outputs.staging }}
      additional-changelog: fafdevelop

  deploy:
    name: Update FAF Develop
    needs: [refs, test, changelog-lua]
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.push.outputs.deployed }}
    steps:
      # https://github.com/actions/checkout/tree/v6/
      - name: Checkout FA repository
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.SSH_FAFOREVER_MACHINE_USER }}
          ref: ${{ needs.refs.outputs.staging }}

      - name: Setup Git configuration
        run: |
          # Configure git
          git config user.email "github@faforever.com"
          git config user.name "FAForever Machine User"

      # Allows us to better understand the game version and the specific commit hash when we receive a log
      - name: Update version references
        run: |
          COMMITHASH=$(git rev-parse HEAD)
          sed -i "s/local Commit = 'unknown'/local Commit = \"${COMMITHASH}\"/" "lua/version.lua"
          sed -i "s/local GameType = 'unknown'/local GameType = \"FAF Develop\"/" "lua/version.lua"

          # debugging
          cat lua/version.lua

      # Disable debugging statements
      # You can overwrite these adjustments by setting up a `Debug` folder
      - name: Overwrite debug references
        run: |
          sed -i "s/EnabledDrawing = true,/EnabledDrawing = false,/" "lua/shared/components/DebugComponent.lua"

          # debugging
          cat lua/shared/components/DebugComponent.lua

      - name: Commit the changes
        run: |
          git stage .
          git commit -m "Post-process deployment"

      - name: Delete old lua changelogs
        run: rm -f lua/ui/lobby/changelog/generated/*

      - name: Retrieve generated lua changelog
        uses: actions/download-artifact@v7
        with:
          name: lua_changelog
          path: lua/ui/lobby/changelog/generated

      - name: Commit lua changelog
        run: |
          # Check if there are any changes
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to deploy"
            exit 0
          fi
          git stage lua/ui/lobby/changelog/generated
          git commit -m "Add changelog"

      # Update the deploy/fafdevelop branch, we force push here because
      # we're not interested in fixing conflicts
      - name: Update deploy/fafdevelop
        id: push
        run: |
          git push origin HEAD:deploy/fafdevelop --force
          echo "deployed=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Updates the status comments of the pull requests that were staged, also
  # when the tests or the deployment failed
  report:
    name: Report to labeled pull requests
    needs: [refs, test, changelog-lua, deploy]
    if: ${{ !cancelled() && needs.refs.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # https://github.com/actions/checkout/tree/v6/
      - name: Checkout FA repository
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Git configuration
        run: |
          # Configure git
          git config user.email "github@faforever.com"
          git config user.name "FAForever Machine User"

      - name: Report deployment
        env:
          RESULT: ${{ needs.test.result == 'failure' && 'tests' || (needs.deploy.result == 'success' && 'success' || 'failed') }}
          STAGING: ${{ needs.refs.outputs.staging }}
          DEPLOYED: ${{ needs.deploy.outputs.deployed }}
          PREVIOUS: ${{ needs.refs.outputs.previous }}
          MANUAL_BY: ${{ github.event_name == 'workflow_dispatch' && github.actor || '' }}
        run: |
          # The staging commit may no longer be on any branch
          git fetch --quiet origin "$STAGING"
          python3 .github/workflows/scripts/python/staging.py deploy staging/fafdevelop --result "$RESULT" --staging "$STAGING" --deployed "$DEPLOYED" --previous "$PREVIOUS" --manual-by "$MANUAL_BY"
