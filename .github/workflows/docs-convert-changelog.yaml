name: Convert all Markdown changelogs to Lua

on:
  workflow_call:
    inputs:
      branch:
        type: string
        required: true
        description: The branch to check out
      additional-changelog:
        type: string # fafdevelop or fafbeta
        description: Add changelog entry for current fafdevelop or fafbeta changes

jobs:
  convert_changelog:
    name: Convert changelog
    runs-on: ubuntu-latest
    steps:
      - name: Set environment variable
        run: |
          echo "SCRIPTS=.github/workflows/scripts/python" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_FAFOREVER_MACHINE_USER }}
          ref: ${{ inputs.branch }}
          sparse-checkout: |
            changelog/snippets
            docs/_posts
            lua/ui/lobby
            .github/workflows

      - name: Download develop changelog
        if: inputs.additional-changelog == 'fafdevelop'
        uses: actions/download-artifact@v4
        with:
          name: changelog-fafdevelop

      - name: Add develop changelog
        if: inputs.additional-changelog == 'fafdevelop'
        run: |
          FILE="${{ github.workspace }}/docs/_posts/fafdevelop.md"
          cat changelog/snippets/sections/template-header-fafdevelop.md >> $FILE
          cat changelog-fafdevelop.md >> $FILE

      - name: Download beta changelog
        if: inputs.additional-changelog == 'fafbeta'
        uses: actions/download-artifact@v4
        with:
          name: changelog-fafbeta

      - name: Add beta changelog
        if: inputs.additional-changelog == 'fafbeta'
        run: |
          FILE="${{ github.workspace }}/docs/_posts/fafbeta.md"
          cat changelog/snippets/sections/template-header-fafbeta.md >> $FILE
          cat changelog-fafbeta.md >> $FILE

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r $SCRIPTS/requirements.txt

      - name: Convert changelog to Lua
        run: |
          rm -f lua/ui/lobby/changelog/generated/*
          out_dir=lua/ui/lobby/changelog/generated
          python3 $SCRIPTS/changelog_markdown2lua.py "docs/_posts" "${out_dir}"

      - name: Create changelog overview in Lua
        run: |
          out_dir=lua/ui/lobby/changelog/generated
          python3 $SCRIPTS/changelog_overview.py "docs/_posts" "${out_dir}/overview.lua"

      - name: Add the Lua changelog as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: lua_changelog
          path: |
            lua/ui/lobby/changelog/generated

  validate_lua_changelog:
    name: Validate Lua changelog
    runs-on: ubuntu-latest
    container: faforever/lua:v5.0-1
    needs: convert_changelog
    steps:
      - name: Install tooling
        run: |
          apk add bash git findutils

      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tests/run-syntax-test.sh

      - name: Download the Lua changelog artifact
        uses: actions/download-artifact@v4
        with:
          name: lua_changelog

      - name: Validate changelog files
        run: |
          ./tests/run-syntax-test.sh
