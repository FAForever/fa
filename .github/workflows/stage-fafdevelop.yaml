name: Stage changes for FAF Develop

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 4"

jobs:
  test:
    uses: ./.github/workflows/tests.yaml
  update:
    name: Update FAF Develop
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      # Writes the status comments of labeled pull requests
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # https://github.com/actions/checkout/tree/v6/
      - name: Checkout FA repository
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.SSH_FAFOREVER_MACHINE_USER }}
          repository: FAForever/fa
          ref: develop
          fetch-depth: 0

      - name: Setup Git configuration
        run: |
          # Configure git
          git config user.email "github@faforever.com"
          git config user.name "FAForever Machine User"

      # Pull requests with the label are squash merged on top of develop and
      # the result is force pushed to staging/fafdevelop, we force push here
      # because we're not interested in fixing conflicts. Pull requests that
      # conflict are left out and reported in the run summary and in their
      # status comment
      - name: Update staging/fafdevelop
        run: python3 .github/workflows/scripts/python/staging.py stage staging/fafdevelop --push
