name: Deploy engine to FAF Develop

# Uploads a release of the faf-re engine (https://github.com/Draiget/faf-re) as the executable of
# FAF Develop. faf-re's own release workflow builds and publishes it; nothing is built here. The
# notes for players of every faf-re release since the previous upload are kept as a release of this
# repository, `fafre-<tag>`, and the FAF Develop changelog shows the latest of them at the next
# FAF Develop deployment (docs-convert-changelog.yaml).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "faf-re release tag, for example 2026.11.009-nightly"
        required: true
        type: string

concurrency:
  # The server is unable to process multiple deployments at the same time
  group: deployment

jobs:
  deploy:
    name: Upload faf-re to FAF Develop
    # Holds the `apiKey` secret, the same key FA-Binary-Patches uploads with
    environment: deploy/fafdevelop
    runs-on: ubuntu-latest
    permissions:
      contents: write # the fafre-<tag> release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the upload key
        env:
          API_KEY: ${{ secrets.apiKey }}
        run: |
          [ -n "$API_KEY" ] || { echo "::error::No apiKey secret in the deploy/fafdevelop environment"; exit 1; }

      - name: Download the release
        run: |
          gh release download "$TAG" --repo Draiget/faf-re \
            --pattern main_x64.exe --pattern SHA256SUMS.txt --pattern player-notes.md

      # The checksums are published with the release by faf-re's release workflow.
      - name: Check the checksum
        run: |
          grep -E ' \*?main_x64\.exe$' SHA256SUMS.txt | sha256sum --check --strict

      - name: Upload to server
        run: curl -f -X "POST"
          "https://api.faforever.com/exe/upload" -F "modName=fafdevelop" -F "apiKey=${{ secrets.apiKey }}"
          -F "file=@main_x64.exe"

      # Each faf-re release's notes cover only the changes since the release before it, so the notes of
      # every release since the previous upload are joined.
      - name: Keep the notes for the changelog
        run: |
          PREVIOUS=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("fafre-"))] | sort_by(.createdAt) | last | .tagName // empty')
          PREVIOUS=${PREVIOUS#fafre-}
          # The releases after the previous upload up to this one, oldest first; only this one on the
          # first upload, or when going back to an earlier release
          gh release list --repo Draiget/faf-re --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | .[].tagName' \
            | awk -v prev="$PREVIOUS" -v tag="$TAG" '$0 == tag { print; exit } on { print } prev != "" && $0 == prev { on = 1 }' \
            > releases.txt
          mkdir -p notes
          : > lines.md
          while read -r RELEASE; do
            if [ "$RELEASE" = "$TAG" ]; then
              cp player-notes.md "notes/$RELEASE.md" 2>/dev/null || true
            else
              # Releases before the notes existed carry none
              gh release download "$RELEASE" --repo Draiget/faf-re --pattern player-notes.md \
                --output "notes/$RELEASE.md" || true
            fi
            [ -f "notes/$RELEASE.md" ] && grep '^- ' "notes/$RELEASE.md" >> lines.md || true
          done < releases.txt
          {
            printf '## faf-re %s\n\n' "$TAG"
            if [ -s lines.md ]; then cat lines.md; else echo "No player-facing changes${PREVIOUS:+ since $PREVIOUS}."; fi
          } > fafdevelop-notes.md
          cat fafdevelop-notes.md
          gh release create "fafre-$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "faf-re $TAG on FAF Develop" --notes-file fafdevelop-notes.md --latest=false
