name: Deploy engine to FAF Develop

# Uploads a release of the faf-re engine (https://github.com/Draiget/faf-re) as the executable of
# FAF Develop. faf-re's own release workflow builds and publishes it; nothing is built here. The
# notes for players of every faf-re release since the previous upload are kept as a release of this
# repository, `fafre-<tag>`, and the FAF Develop changelog shows the latest of them at the next
# FAF Develop deployment (docs-convert-changelog.yaml).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "faf-re release tag, for example 2026.11.009-nightly"
        required: true
        type: string

concurrency:
  # Its own group: the Lua deployments share `deployment` with cancel-in-progress, which would cancel
  # an upload part-way. That group orders their pushes to the deploy branches; the API deploys the Lua
  # afterwards, from the push. The exe upload is a separate API call. Runs of this workflow wait for
  # each other.
  group: deploy-fafdevelop-engine
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload faf-re to FAF Develop
    # Holds the `apiKey` secret, the same key FA-Binary-Patches uploads with
    environment: deploy/fafdevelop
    runs-on: ubuntu-latest
    permissions:
      contents: write # the fafre-<tag> release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the upload key
        env:
          API_KEY: ${{ secrets.apiKey }}
        run: |
          [ -n "$API_KEY" ] || { echo "::error::No apiKey secret in the deploy/fafdevelop environment"; exit 1; }

      - name: Download the release
        run: |
          gh release download "$TAG" --repo Draiget/faf-re \
            --pattern main_x64.exe --pattern SHA256SUMS.txt --pattern player-notes.md

      # The checksums are published with the release by faf-re's release workflow.
      - name: Check the checksum
        run: |
          grep -E ' \*?main_x64\.exe$' SHA256SUMS.txt | sha256sum --check --strict

      # Each faf-re release's notes cover only the changes since the release before it, so the notes of
      # every release since the previous upload are joined. Done before the upload: a failure here
      # changes nothing on FAF Develop.
      - name: Collect the notes since the previous upload
        shell: bash
        run: |
          # A repository's releases, oldest first by when they were published (the API's created_at is
          # the date of the release's commit)
          releases() {
            gh api --paginate "repos/$1/releases?per_page=100" \
              --jq '.[] | select(.draft | not) | "\(.published_at) \(.tag_name)"' | LC_ALL=C sort | cut -d' ' -f2
          }
          PREVIOUS=$(releases "${{ github.repository }}" | { grep '^fafre-' || true; } | tail -n 1)
          PREVIOUS=${PREVIOUS#fafre-}
          echo "Previous upload: ${PREVIOUS:-none}"
          # The releases after the previous upload and before this one; none on the first upload, or
          # when going back to an earlier release
          releases Draiget/faf-re \
            | awk -v prev="$PREVIOUS" -v tag="$TAG" \
              '$0 == tag { found = 1; exit } on { print } prev != "" && $0 == prev { on = 1 }
               END { if (!found) { print "::error::" tag " is not a published faf-re release" > "/dev/stderr"; exit 1 }
                     if (on) print prev > "since.txt" }' \
            > releases.txt
          SINCE=$(cat since.txt 2>/dev/null || true)
          echo "$TAG" >> releases.txt
          mkdir -p notes
          : > lines.md
          while read -r RELEASE; do
            NOTES="notes/$RELEASE.md"
            if [ "$RELEASE" = "$TAG" ]; then
              NOTES=player-notes.md
            else
              ASSETS=$(gh release view "$RELEASE" --repo Draiget/faf-re --json assets --jq '.assets[].name')
              # Releases before the notes existed carry none; any other failure stops the run
              if printf '%s\n' "$ASSETS" | grep -qx 'player-notes.md'; then
                gh release download "$RELEASE" --repo Draiget/faf-re --pattern player-notes.md --output "$NOTES"
              fi
            fi
            if [ -f "$NOTES" ]; then grep '^- ' "$NOTES" >> lines.md || true; fi
          done < releases.txt
          {
            printf '## faf-re %s\n\n' "$TAG"
            if [ -s lines.md ]; then cat lines.md; else echo "No player-facing changes${SINCE:+ since $SINCE}."; fi
          } > fafdevelop-notes.md
          cat fafdevelop-notes.md

      - name: Upload to server
        run: curl -f -X "POST"
          "https://api.faforever.com/exe/upload" -F "modName=fafdevelop" -F "apiKey=${{ secrets.apiKey }}"
          -F "file=@main_x64.exe"

      # A release deployed again (going back to it) gets its record anew, so it is the newest one. If
      # this step fails, re-run the workflow: uploading the same exe again changes nothing.
      - name: Record the deployment for the changelog
        shell: bash
        run: |
          if gh release view "fafre-$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release delete "fafre-$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
          fi
          gh release create "fafre-$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "faf-re $TAG on FAF Develop" --notes-file fafdevelop-notes.md --latest=false
